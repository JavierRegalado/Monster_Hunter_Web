<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="/Proyectos/MonsterHunterWebApp/styles/global.css">

<body>
    <header>

            <img src="/Proyectos/MonsterHunterWebApp/styles/images/logo_mhs.png" alt="Monster Hunter Logo">

        <nav>
